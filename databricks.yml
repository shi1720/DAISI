# Authenticate with a named CLI profile or Databricks unified authentication.
# No workspace hostname, token, principal identifier, or personal email is embedded.
bundle:
  name: hawkerbridge
  databricks_cli_version: ">=0.283.0"

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: Existing SQL warehouse ID (reuse the Free Edition warehouse)
  catalog:
    description: Existing Unity Catalog catalog in the target workspace
    default: workspace
  schema:
    description: Dedicated HawkerBridge managed schema
    default: hawkerbridge
  app_name:
    description: Workspace-unique lowercase Databricks App name
    default: hawkerbridge
  input_mode:
    description: live or archived_replay; a live failure never automatically replays an archive
    default: live
  reuse_archived_geometry:
    description: Reuse checksummed slow-changing URA boundaries with original timestamps and provenance
    default: "true"

sync:
  include:
    - frontend/dist/**
    - data/raw/**
    - data/processed/snapshot.json
  exclude:
    - .venv/**
    - .git/**
    - .env*
    - state/**
    - output/**
    - research/**
    - frontend/node_modules/**
    - frontend/test-results/**
    - frontend/playwright-report/**
    - '**/__pycache__/**'
    - '**/.pytest_cache/**'

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development
