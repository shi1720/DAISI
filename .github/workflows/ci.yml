name: Verify HawkerBridge
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_demo:
        description: Record the real 173-second silent demo for voiceover
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser-tests/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: .venv/bin/ruff check backend tests scripts databricks
      - run: .venv/bin/pytest --cov=hawkerbridge --cov-report=term-missing --cov-report=xml -q
      - run: npm ci && npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - name: Cache Chromium browser runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('browser-tests/package-lock.json') }}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: browser-tests
      - run: npm test
        working-directory: browser-tests
        env:
          HAWKERBRIDGE_DATABASE: /tmp/hawkerbridge-ci.db
          HAWKERBRIDGE_RECORD_DEMO: ${{ github.event.inputs.record_demo == 'true' && '1' || '' }}
      - name: Preserve PNG evidence in logs
        if: always()
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          paths = [(p.name, p) for p in sorted(Path('output/screenshots').glob('*.png'))]
          paths += [(f'failure-{p.parent.name}.png', p) for p in sorted(Path('output/browser-results').rglob('test-failed-*.png'))]
          for name, path in paths[:16]:
              raw = path.read_bytes()
              if len(raw) > 4 * 1024 * 1024:
                  print(f'HB_PNG_SKIPPED|{name}|too-large')
                  continue
              encoded = base64.b64encode(raw).decode('ascii')
              print(f'HB_PNG_BEGIN|{name}|{hashlib.sha256(raw).hexdigest()}|{len(raw)}')
              for i in range(0, len(encoded), 4096):
                  print('HB_PNG_DATA|' + encoded[i:i+4096])
              print('HB_PNG_END|' + name)
          for name in ['hawkerbridge-silent-walkthrough.webm', 'timeline.json', 'recorded-demo-plan.pdf']:
              path = Path('output/demo-footage') / name
              if not path.exists():
                  continue
              raw = path.read_bytes()
              if len(raw) > 12 * 1024 * 1024:
                  print(f'HB_MEDIA_SKIPPED|{name}|too-large')
                  continue
              encoded = base64.b64encode(raw).decode('ascii')
              print(f'HB_MEDIA_BEGIN|{name}|{hashlib.sha256(raw).hexdigest()}|{len(raw)}')
              for i in range(0, len(encoded), 4096):
                  print('HB_MEDIA_DATA|' + encoded[i:i+4096])
              print('HB_MEDIA_END|' + name)
          PY
      - name: Preserve browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hawkerbridge-browser-evidence
          path: |
            output/screenshots
            output/browser-report
            output/browser-results
            output/demo-footage
            coverage.xml
          retention-days: 14
