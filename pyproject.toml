[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hawkerbridge"
version = "1.0.0"
description = "Hawker closure continuity planning with Singapore open data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2.0,<3", "scipy>=1.14,<2", "shapely>=2.0,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23.1,<26", "reportlab>=4.2,<5",
  "databricks-sdk>=0.65,<1", "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pypdf>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["backend/hawkerbridge"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
